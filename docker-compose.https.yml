# Use with docker-compose.yml; requires a domain pointing to this server.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CITETRACE_DOMAIN: ${CITETRACE_DOMAIN:?Set CITETRACE_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      citetrace:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
