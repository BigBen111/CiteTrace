name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,web]"
      - run: pytest -q
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/init_config.py
      - run: docker compose config --quiet
      - run: CITETRACE_DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail --retry 5 http://127.0.0.1:8000/health
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
