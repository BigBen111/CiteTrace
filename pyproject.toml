[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citetrace"
version = "0.1.0"
description = "Multi-agent evidence tracing and hallucination suppression for research-paper factual QA"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.50",
  "pymupdf>=1.24",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
citetrace = "citetrace.app:main"

[tool.setuptools.packages.find]
include = ["citetrace*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
